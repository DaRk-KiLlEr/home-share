services:
  exited_container_restarter:
    image: docker:cli
    container_name: exited_container_restarter
    hostname: exited_container_restarter
    network_mode: none
    volumes: [ "/var/run/docker.sock:/var/run/docker.sock" ]
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          sleep 600
          # echo "$$(date '+%Y-%m-%d %H:%M:%S') - [INFO] A iniciar verificação..."
          
          containers=$$(docker ps -a -f status=exited --format '{{.Names}}')
          
          if [ -n "$$containers" ]; then
            echo "$$containers" | while read -r name; do
              if [ -n "$$name" ] && [ "$$name" != "exited_container_restarter" ]; then
                echo "$$(date '+%Y-%m-%d %H:%M:%S') - [EXITED] Iniciando contentor parado: $$name"
                res=$$(docker start "$$name")
                echo "$$(date '+%Y-%m-%d %H:%M:%S') - $$res: iniciado"
              fi
            done
          fi
        done
    restart: unless-stopped
