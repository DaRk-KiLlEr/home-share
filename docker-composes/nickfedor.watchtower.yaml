services:
  watchtower:
    image: nickfedor/watchtower:latest
    container_name: watchtower
    hostname: watchtower
    # command: hawser # para updates de containers especificos
    environment:
      WATCHTOWER_POLL_INTERVAL: 21600
      WATCHTOWER_LOG_LEVEL: info
      WATCHTOWER_LOG_FORMAT: Auto
      WATCHTOWER_CLEANUP: true
      WATCHTOWER_REMOVE_VOLUMES: true
      WATCHTOWER_INCLUDE_STOPPED: true
      WATCHTOWER_NO_STARTUP_MESSAGE: true
      WATCHTOWER_REVIVE_STOPPED: true
      WATCHTOWER_INCLUDE_RESTARTING: true
      WATCHTOWER_UPDATE_ON_START: true
      WATCHTOWER_NOTIFICATION_URL: smtp://email.envio@gmail.com:envio.password@smtp.gmail.com:587/?fromaddress=email.envio@gmail.com&toaddresses=email.recebe@gmail.com&encryption=ExplicitTLS&usestarttls=yes
      WATCHTOWER_NOTIFICATIONS_DELAY: 10
    volumes:
       - /var/run/docker.sock:/var/run/docker.sock
       - /etc/localtime:/etc/localtime:ro
    healthcheck:
      disable: true
    restart: unless-stopped
