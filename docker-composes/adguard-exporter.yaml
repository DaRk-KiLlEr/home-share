services:
  adguard-exporter:
    image: jonanek/adguardhome-exporter:latest
    container_name: adguard-exporter
    hostname: adguard-exporter
    environment:
      PORT: "9617"
      SCRAPE_INTERVAL_SECONDS: "30"
      ADGUARD_URL_1: "http://192.168.100.170:5353"
      ADGUARD_URL_2: "http://192.168.100.171:5353"
      ADGUARD_URL_3: "http://192.168.100.174:5353"
      ADGUARD_USERNAME_1: "${ADGUARD_USERNAME_1}"
      ADGUARD_PASSWORD_1: "${ADGUARD_PASSWORD_1}"
      ADGUARD_USERNAME_2: "${ADGUARD_USERNAME_2}"
      ADGUARD_PASSWORD_2: "${ADGUARD_PASSWORD_2}"
      ADGUARD_USERNAME_3: "${ADGUARD_USERNAME_3}"
      ADGUARD_PASSWORD_3: "${ADGUARD_PASSWORD_3}"
    ports:
      - "9617:9617"
    volumes:
      - /appdata/adguard_home-exporter-new/entrypoint.sh:/entrypoint.sh:ro
      - /etc/localtime:/etc/localtime:ro
    restart: unless-stopped
