services:
  adguard-exporter:
    image: ghcr.io/henrywhitaker3/adguard-exporter:latest
    container_name: adguard-exporter
    hostname: adguard-exporter
    environment:
      ADGUARD_SERVERS: "http://192.168.100.170:5353,http://192.168.100.171:5353,http://192.168.100.174:5353"
      ADGUARD_USERNAMES: ""
      ADGUARD_PASSWORDS: ""
      INTERVAL: 30s
      DEBUG: "true"
    ports:
      - "9618:9618"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    restart: on-failure
