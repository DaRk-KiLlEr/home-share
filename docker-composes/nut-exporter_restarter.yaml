services:
  nut-exporter_restarter:
    image: docker:cli
    container_name: nut-exporter_restarter
    hostname: nut-exporter_restarter
    network_mode: none
    volumes: [ "/var/run/docker.sock:/var/run/docker.sock" ]
    command:
      - /bin/sh
      - -c
      - |
        while true; do
          sleep 30

          errors=$$(docker logs --since 35s nut-exporter 2>&1 | grep -c "failed connecting to server")

          if [ "$$errors" -ge 1 ]; then
            echo "$$(date '+%Y-%m-%d %H:%M:%S') - [ERROR] Detetado $$errors erro 'failed connecting to server' no nut-exporter"
            echo "$$(date '+%Y-%m-%d %H:%M:%S') - [RESTART] A reiniciar nut-exporter..."
            docker restart nut-exporter
            sleep 60
          fi
        done
    restart: unless-stopped
